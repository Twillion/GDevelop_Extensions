<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="50%" stop-color="#241744" />
      <stop offset="100%" stop-color="#0a0815" />
    </linearGradient>
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="#3a2f64" stroke-width="4" />

  <!-- MIDI 5-Pin DIN Port Motif -->
  <g transform="translate(128, 70)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="#1b1530" stroke="url(#synthGrad)" stroke-width="3.5" />
    <circle cx="-16" cy="-8" r="4.5" fill="#00f0ff" />
    <circle cx="-10" cy="-20" r="4.5" fill="#ff2a85" />
    <circle cx="0" cy="-24" r="4.5" fill="#9d4edd" />
    <circle cx="10" cy="-20" r="4.5" fill="#ff2a85" />
    <circle cx="16" cy="-8" r="4.5" fill="#00f0ff" />
    <!-- Center key notch -->
    <path d="M -5,14 L 5,14 L 3,24 L -3,24 Z" fill="#4d3f78" />
  </g>

  <!-- FM Synthesis Audio Waves -->
  <g filter="url(#glow)">
    <path d="M 28,140 Q 55,100 85,140 T 142,140 T 200,140 T 228,140" fill="none" stroke="#ff2a85" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M 28,145 Q 60,185 92,145 T 156,145 T 228,145" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Piano Keyboard Bed -->
  <g transform="translate(32, 168)">
    <!-- Base plate -->
    <rect x="0" y="0" width="192" height="60" rx="8" fill="#120e22" stroke="#4a3e7a" stroke-width="2" />
    
    <!-- White Keys -->
    <rect x="4" y="4" width="24" height="52" rx="4" fill="#f8f9fa" />
    <rect x="31" y="4" width="24" height="52" rx="4" fill="#f8f9fa" />
    <rect x="58" y="4" width="24" height="52" rx="4" fill="#f8f9fa" />
    <rect x="85" y="4" width="24" height="52" rx="4" fill="#f8f9fa" />
    <rect x="112" y="4" width="24" height="52" rx="4" fill="#f8f9fa" />
    <rect x="139" y="4" width="24" height="52" rx="4" fill="#f8f9fa" />
    <rect x="166" y="4" width="22" height="52" rx="4" fill="#f8f9fa" />

    <!-- Black Keys -->
    <rect x="20" y="4" width="16" height="32" rx="2" fill="#201a35" stroke="#ff2a85" stroke-width="1.5" />
    <rect x="47" y="4" width="16" height="32" rx="2" fill="#201a35" stroke="#ff2a85" stroke-width="1.5" />
    <rect x="101" y="4" width="16" height="32" rx="2" fill="#201a35" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="128" y="4" width="16" height="32" rx="2" fill="#201a35" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="155" y="4" width="16" height="32" rx="2" fill="#201a35" stroke="#00f0ff" stroke-width="1.5" />
  </g>
</svg>
