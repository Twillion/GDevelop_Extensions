<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040714"/>
    </linearGradient>
    <linearGradient id="nmGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="nmPinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="nmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="12" fill="url(#nmBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- 3D Isometric Navmesh Wireframe Grid -->
  <g stroke="#334155" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base polygon grid lines (isometric projection) -->
    <polygon points="32,8 56,20 56,44 32,56 8,44 8,20" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Internal mesh triangulation edges -->
    <line x1="32" y1="8" x2="32" y2="32"/>
    <line x1="8" y1="20" x2="32" y2="32"/>
    <line x1="56" y1="20" x2="32" y2="32"/>
    <line x1="8" y1="44" x2="32" y2="32"/>
    <line x1="56" y1="44" x2="32" y2="32"/>
    <line x1="32" y1="56" x2="32" y2="32"/>

    <!-- Secondary diagonals creating triangular navigation polygons -->
    <line x1="8" y1="20" x2="32" y2="20" stroke="#475569" stroke-dasharray="2 2"/>
    <line x1="32" y1="20" x2="56" y2="20" stroke="#475569" stroke-dasharray="2 2"/>
    <line x1="20" y1="26" x2="20" y2="38" stroke="#475569" stroke-dasharray="1.5 1.5"/>
    <line x1="44" y1="26" x2="44" y2="38" stroke="#475569" stroke-dasharray="1.5 1.5"/>
    <line x1="8" y1="32" x2="32" y2="44" stroke="#475569" stroke-dasharray="2 2"/>
    <line x1="56" y1="32" x2="32" y2="44" stroke="#475569" stroke-dasharray="2 2"/>
  </g>

  <!-- Walkable NavMesh Highlighted Wireframe -->
  <g stroke="#00f0ff" stroke-width="1.3" fill="none" opacity="0.85" filter="url(#nmGlow)">
    <polyline points="14,23 32,14 50,23"/>
    <polyline points="14,35 32,26 50,35"/>
    <polyline points="20,44 32,38 44,44"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
  </g>

  <!-- Glowing Agent Navigation Path -->
  <g filter="url(#nmGlow)">
    <polyline points="16,36 28,30 36,36 48,28" stroke="url(#nmGlowGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Waypoint Nodes -->
    <circle cx="16" cy="36" r="2.2" fill="#00ffcc"/>
    <circle cx="28" cy="30" r="1.8" fill="#38bdf8"/>
    <circle cx="36" cy="36" r="1.8" fill="#38bdf8"/>
    <circle cx="48" cy="28" r="2.5" fill="#f43f5e"/>
  </g>

  <!-- Target Destination Marker -->
  <g transform="translate(48, 28)">
    <circle cx="0" cy="0" r="6" fill="url(#nmPinGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>
</svg>
