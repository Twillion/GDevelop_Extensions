<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="lodGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="lodGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ab47bc" />
      <stop offset="100%" stop-color="#7b1fa2" />
    </linearGradient>
    <linearGradient id="lodGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1e1e24" stroke="#33333d" stroke-width="2"/>
  
  <!-- Wireframe & Faceted 3D Mesh Pyramid / Crystal -->
  <g filter="url(#glow)">
    <!-- High Poly Top Facet (Cyan) -->
    <polygon points="32,8 14,24 32,28" fill="url(#lodGrad1)" opacity="0.9"/>
    <polygon points="32,8 32,28 50,24" fill="url(#lodGrad1)" opacity="0.75"/>
    
    <!-- Medium Poly Mid Facets (Purple) -->
    <polygon points="14,24 8,42 32,46" fill="url(#lodGrad2)" opacity="0.9"/>
    <polygon points="50,24 32,46 56,42" fill="url(#lodGrad2)" opacity="0.75"/>
    <polygon points="14,24 32,28 32,46" fill="url(#lodGrad2)" opacity="0.6"/>
    <polygon points="50,24 32,28 32,46" fill="url(#lodGrad2)" opacity="0.85"/>
    
    <!-- Low Poly Base Facets (Orange) -->
    <polygon points="8,42 32,56 32,46" fill="url(#lodGrad3)" opacity="0.95"/>
    <polygon points="56,42 32,56 32,46" fill="url(#lodGrad3)" opacity="0.8"/>
  </g>
  
  <!-- Mesh Wireframe Lines -->
  <polyline points="32,8 14,24 8,42 32,56 56,42 50,24 32,8" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.8"/>
  <polyline points="32,8 32,28 32,46 32,56" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.9"/>
  <polyline points="14,24 32,28 50,24" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <polyline points="8,42 32,46 56,42" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  
  <!-- LOD Level Indicators -->
  <circle cx="32" cy="18" r="1.5" fill="#ffffff"/>
  <circle cx="23" cy="35" r="1.5" fill="#ffffff"/>
  <circle cx="41" cy="35" r="1.5" fill="#ffffff"/>
  <circle cx="32" cy="51" r="1.5" fill="#ffffff"/>
</svg>
