<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#003566" />
    </linearGradient>
    <linearGradient id="potionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Oceanic Background Rounded Box -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#07111e" stroke="#1e3a5f" stroke-width="3" />

  <!-- Background Water Swells -->
  <path d="M8 82 C28 72, 48 88, 70 78 C92 68, 110 82, 120 76 L120 120 L8 120 Z" fill="url(#oceanGrad)" opacity="0.4" />

  <!-- Midground Waves -->
  <path d="M8 92 C24 80, 52 98, 78 86 C100 76, 114 90, 120 84 L120 120 L8 120 Z" fill="url(#oceanGrad)" opacity="0.8" />

  <!-- Foreground Gerstner Sharp Crest Wave -->
  <path d="M8 100 Q 28 82, 44 94 T 84 94 Q 104 80, 120 92 L120 120 L8 120 Z" fill="url(#oceanGrad)" />

  <!-- Foam Crest Highlights -->
  <path d="M26 84 Q 36 80, 46 92 Q 38 88, 26 84 Z" fill="url(#foamGrad)" />
  <path d="M82 82 Q 94 78, 106 90 Q 96 86, 82 82 Z" fill="url(#foamGrad)" />

  <!-- Potion / Pouring Flask Silhouette -->
  <g transform="translate(14, 12) rotate(-28, 48, 40)">
    <!-- Flask Neck & Body -->
    <path d="M42 16 L54 16 L54 26 L66 46 A 14 14 0 0 1 54 66 L42 66 A 14 14 0 0 1 30 46 L42 26 Z" 
          fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Flask Lip -->
    <line x1="38" y1="16" x2="58" y2="16" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Potion Liquid inside Flask -->
    <path d="M34 50 Q 48 44, 62 50 A 12 12 0 0 1 54 63 L42 63 A 12 12 0 0 1 34 50 Z" 
          fill="url(#potionGrad)" filter="url(#glow)" opacity="0.9" />
  </g>

  <!-- Pouring Liquid Stream & Droplets -->
  <path d="M72 38 Q 78 52, 82 66 Q 84 74, 82 82" 
        fill="none" stroke="url(#potionGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Droplets -->
  <circle cx="84" cy="62" r="3.5" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="81" cy="76" r="2.8" fill="#ec4899" filter="url(#glow)" />
  <circle cx="83" cy="88" r="4.2" fill="#d946ef" filter="url(#glow)" />
  <circle cx="86" cy="98" r="2.2" fill="#00f2fe" filter="url(#glow)" />
</svg>
