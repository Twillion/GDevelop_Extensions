<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Motion Tween Waves (Behind Camera) -->
  <path d="M 8 20 Q 16 12, 26 22 T 44 20 T 56 12" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 8 46 Q 20 54, 32 44 T 50 48 T 56 42" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- 3D Camera Body -->
  <g filter="url(#glow)">
    <!-- Main Body -->
    <rect x="12" y="20" width="28" height="24" rx="5" fill="url(#camGrad)"/>
    <!-- Top Flash / Sensor Mount -->
    <path d="M 18 20 L 22 15 L 30 15 L 34 20 Z" fill="#4f46e5"/>
    <circle cx="26" cy="17.5" r="1.5" fill="#38bdf8"/>

    <!-- Lens Barrel -->
    <path d="M 40 25 L 50 21 L 50 43 L 40 39 Z" fill="url(#lensGrad)"/>
    <!-- Lens Ring & Aperture -->
    <ellipse cx="50" cy="32" rx="3" ry="11" fill="#be123c"/>
    <ellipse cx="50" cy="32" rx="1.5" ry="6" fill="#fb7185"/>

    <!-- Camera Lens Reflections -->
    <circle cx="26" cy="32" r="7" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="4.5" fill="#312e81"/>
    <circle cx="28" cy="30" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Spring / Oscillation Dynamic Trajectory (Damped Lissajous) -->
  <path d="M 14 32 C 18 26, 20 38, 24 32 C 28 27, 30 36, 34 32 C 38 29, 42 34, 46 32" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="46" cy="32" r="2" fill="#38bdf8"/>
</svg>
