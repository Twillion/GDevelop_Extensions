<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="topCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="upperFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="upperFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="lowerFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="lowerFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="cutLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Top Hex Cap -->
  <polygon points="32,6 44,12 44,18 32,22 20,18 20,12" fill="url(#topCap)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Upper Sloped Facets -->
  <polygon points="20,18 32,22 32,32 10,32" fill="url(#upperFacet1)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="32,22 44,18 54,32 32,32" fill="url(#upperFacet2)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="44,12 44,18 54,32 58,26" fill="url(#upperFacet1)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="20,12 20,18 10,32 6,26" fill="url(#upperFacet2)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Middle Equator Slicing Indicator -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="url(#cutLine)" stroke-width="2" stroke-dasharray="3 2" stroke-linecap="round"/>

  <!-- Lower Sloped Facets -->
  <polygon points="10,32 32,32 32,42 20,46" fill="url(#lowerFacet1)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="32,32 54,32 44,46 32,42" fill="url(#lowerFacet2)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="54,32 58,38 44,52 44,46" fill="url(#lowerFacet1)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="10,32 6,38 20,52 20,46" fill="url(#lowerFacet2)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Bottom Hex Cap -->
  <polygon points="32,42 44,46 44,52 32,58 20,52 20,46" fill="url(#lowerFacet2)" stroke="#0f172a" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
