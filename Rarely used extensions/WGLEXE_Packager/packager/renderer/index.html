<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>WGLEXE Packager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="tabs">
      <button class="tab is-active" data-screen="package">Package</button>
      <button class="tab" data-screen="settings">Settings</button>
      <div class="spacer"></div>
      <span id="preset-label" class="preset-label"></span>
    </nav>

    <!-- Screen 1 -------------------------------------------------------- -->
    <section id="screen-package" class="screen is-active">
      <div class="drop" id="drop-zone">
        <label class="field-row">
          <span class="field-label">Exported GDevelop project</span>
          <span class="input-with-button">
            <input type="text" id="source-dir" placeholder="Drop a folder here, or browse…" />
            <button id="browse-source">Browse…</button>
          </span>
        </label>
        <p id="source-status" class="status"></p>

        <label class="field-row">
          <span class="field-label">Output folder</span>
          <span class="input-with-button">
            <input type="text" id="output-dir" placeholder="Where the depot folder is written…" />
            <button id="browse-output">Browse…</button>
          </span>
        </label>
        <p id="runtime-status" class="status"></p>
      </div>

      <div class="actions">
        <button id="package-button" class="primary" disabled>Package</button>
        <button id="reveal-button" hidden>Show in folder</button>
        <span id="package-status" class="status"></span>
      </div>

      <div id="warning-strip" class="warning-strip" hidden></div>

      <h2 class="section-heading">Log</h2>
      <div id="log" class="log" role="log" aria-live="polite"></div>

      <h2 class="section-heading" id="checks-heading" hidden>Verification</h2>
      <ul id="checks" class="checks" hidden></ul>
    </section>

    <!-- Screen 2 -------------------------------------------------------- -->
    <section id="screen-settings" class="screen">
      <div class="preset-bar">
        <label>
          Preset
          <select id="preset-select"></select>
        </label>
        <button id="save-preset">Save as preset…</button>
        <span class="hint">Defaults are safe. Ticking nothing gives a correct Steam build.</span>
      </div>
      <div id="settings-groups"></div>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
