<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141a24" />
  <!-- Background Wireframe Triangles -->
  <polygon points="32,8 54,48 10,48" fill="none" stroke="#2c3b52" stroke-width="1.5" />
  <line x1="32" y1="8" x2="32" y2="48" stroke="#2c3b52" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="10" y1="48" x2="43" y2="28" stroke="#2c3b52" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="54" y1="48" x2="21" y2="28" stroke="#2c3b52" stroke-width="1" stroke-dasharray="2,2" />
  <!-- Fore/Mid Poly Mesh -->
  <polygon points="32,16 48,44 16,44" fill="url(#polyGrad)" opacity="0.35" />
  <polygon points="32,16 48,44 16,44" fill="none" stroke="#38ef7d" stroke-width="2" />
  <line x1="32" y1="16" x2="32" y2="44" stroke="#38ef7d" stroke-width="1.5" />
  <!-- LOD Level Badges -->
  <circle cx="16" cy="44" r="3" fill="#ff9900" />
  <circle cx="48" cy="44" r="3" fill="#ff9900" />
  <circle cx="32" cy="16" r="3" fill="#ff9900" />
  <!-- LOD Stepper Bars -->
  <rect x="18" y="52" width="6" height="4" rx="1" fill="#38ef7d" />
  <rect x="29" y="52" width="6" height="4" rx="1" fill="#ffaa00" />
  <rect x="40" y="52" width="6" height="4" rx="1" fill="#ff5500" />
</svg>
