    <line x1="6" y1="6" x2="32" y2="58" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="58" y1="6" x2="32" y2="58" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="10" y1="48" x2="32" y2="58" stroke="#38bdf8" stroke-opacity="0.3"/>
