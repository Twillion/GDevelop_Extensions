<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhombic Dodecahedron Direction Cycle</title>
<style>:root{color-scheme:dark;--bg:#0e141b;--panel:#18222d;--line:#344355;--text:#edf5ff;--muted:#a5b2c2;--green:#3e9a59;--orange:#e7a14b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:16px}h1{font-size:22px;margin:0}.sub{color:var(--muted);margin:3px 0 12px}.stage{height:min(72vh,680px);min-height:480px;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#25394a,#111922 65%,#0b1016)}canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}.state{position:absolute;top:15px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}.state strong{display:block;font-size:22px;letter-spacing:.08em}.state span{color:var(--muted)}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.controls label{display:flex;align-items:center;gap:7px}button{font:inherit;color:var(--text);background:#222e3b;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}input[type=range]{width:150px}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-top:9px}.key:before{content:"";display:inline-block;width:11px;height:11px;border-radius:2px;background:var(--c);margin-right:6px}@media(max-width:600px){.stage{height:540px}.state strong{font-size:17px}}</style></head>
<body><main><h1>Rhombic Dodecahedron — Radial Direction Cycle</h1><p class="sub">Matches <code>SetDirectedHalf(0..5)</code> · six symmetrical halves · three opposite center-plane pairs · exact Z-up object orientation</p>
<section class="stage"><canvas id="gl" aria-label="Interactive WebGL rhombic dodecahedron radial direction cycle"></canvas><div class="state"><strong id="stateName">DIRECTION 0</strong><span id="stateDetail">Plane 0 ↔ 3 · retaining side 0</span></div></section>
<div class="controls"><button id="previous" type="button">Previous</button><button id="play" type="button">Pause</button><button id="next" type="button">Next</button><label>Cycle speed <input id="speed" type="range" min="1" max="6" step=".25" value="2.5"><output id="speedValue">2.5s</output></label><label>Face opacity <input id="opacity" type="range" min="5" max="100" value="88"><output id="opacityValue">88%</output></label><label><input id="ghost" type="checkbox"> Full-shape ghost</label><label><input id="wire" type="checkbox" checked> Edges</label><button id="reset" type="button">Reset view</button></div>
<div class="legend"><span class="key" style="--c:var(--green)">Retained symmetrical half</span><span class="key" style="--c:var(--orange)">Complete center cut face</span></div>
</main><script>(()=>{
const canvas=document.getElementById('gl'),gl=canvas.getContext('webgl',{alpha:true,antialias:true});if(!gl)return;const VS='attribute vec3 p;attribute vec4 c;varying vec4 v;void main(){gl_Position=vec4(p,1.);v=c;}',FS='precision mediump float;varying vec4 v;void main(){gl_FragColor=v;}';function shader(t,s){const q=gl.createShader(t);gl.shaderSource(q,s);gl.compileShader(q);return q}const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);gl.useProgram(program);const pb=gl.createBuffer(),cb=gl.createBuffer(),pa=gl.getAttribLocation(program,'p'),ca=gl.getAttribLocation(program,'c');gl.enableVertexAttribArray(pa);gl.enableVertexAttribArray(ca);gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)},S=[-1,1],C={},X={},Y={},Z={},key=(x,y,z)=>x+','+y+','+z,UP=norm([1,1,1]),RIGHT=norm([1,-1,0]),BACK=norm([1,1,-2]),transform=p=>[dot(p,RIGHT),dot(p,BACK),dot(p,UP)];for(const x of S)for(const y of S)for(const z of S)C[key(x,y,z)]=[x,y,z];for(const s of S){X[s]=[2*s,0,0];Y[s]=[0,2*s,0];Z[s]=[0,0,2*s]}const source=[];for(const s of S)for(const t of S)source.push([X[s],C[key(s,t,1)],Y[t],C[key(s,t,-1)]]);for(const s of S)for(const u of S)source.push([X[s],C[key(s,1,u)],Z[u],C[key(s,-1,u)]]);for(const t of S)for(const u of S)source.push([Y[t],C[key(1,t,u)],Z[u],C[key(-1,t,u)]]);const shell=source.map(f=>f.map(transform)),EPS=1e-7;
function clip(poly,n,positive){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=dot(a,n),db=dot(b,n),ia=positive?da>=-EPS:da<=EPS,ib=positive?db>=-EPS:db<=EPS;if(ia)out.push(a);if(ia!==ib)out.push(add(a,mul(sub(b,a),da/(da-db))))}return out}const edges=[];for(const f of shell)for(let i=0;i<f.length;i++){const a=f[i],b=f[(i+1)%f.length],same=(p,q)=>Math.hypot(...sub(p,q))<1e-5;if(!edges.some(e=>(same(e[0],a)&&same(e[1],b))||(same(e[0],b)&&same(e[1],a))))edges.push([a,b])}function plane(n){const pts=[];for(const[a,b]of edges){const da=dot(a,n),db=dot(b,n);if(Math.abs(da)<EPS)pts.push(a);if(Math.abs(db)<EPS)pts.push(b);if(da*db<-EPS)pts.push(add(a,mul(sub(b,a),da/(da-db))))}const q=[];for(const p of pts)if(!q.some(v=>Math.hypot(...sub(p,v))<1e-5))q.push(p);const seed=Math.abs(n[2])<.9?[0,0,1]:[1,0,0],u=norm([seed[1]*n[2]-seed[2]*n[1],seed[2]*n[0]-seed[0]*n[2],seed[0]*n[1]-seed[1]*n[0]]),v=norm([n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]]);return q.sort((a,b)=>Math.atan2(dot(a,v),dot(a,u))-Math.atan2(dot(b,v),dot(b,u)))}const middle=plane([0,0,1]).sort((a,b)=>Math.atan2(a[1],a[0])-Math.atan2(b[1],b[0])),rays=middle.map(p=>norm([p[0],p[1],0])),normals=rays.map(r=>[-r[1],r[0],0]);
const ui=id=>document.getElementById(id);let direction=0,playing=true,elapsed=0,last=performance.now(),yaw=-.58,pitch=.52,zoom=1,drag=false,lx=0,ly=0;function updateText(){const pair=direction%3;ui('stateName').textContent='DIRECTION '+direction;ui('stateDetail').textContent='Plane '+pair+' ↔ '+(pair+3)+' · retaining side '+direction;ui('speedValue').value=(+ui('speed').value).toFixed(2).replace(/0$/,'')+'s';ui('opacityValue').value=ui('opacity').value+'%'}function step(delta){direction=(direction+delta+6)%6;elapsed=0;updateText()}
function project(p,aspect){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*cy-p[1]*sy,d=p[0]*sy+p[1]*cy,y=p[2]*cp-d*sp,z=d*cp+p[2]*sp,s=.46*zoom;return[x*s/aspect,y*s,z*.08]}function draw(mode,p,c){if(!p.length)return;gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(p),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(pa,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(c),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(ca,4,gl.FLOAT,false,0,0);gl.drawArrays(mode,0,p.length/3)}function color(base,a,n){const light=norm([-.4,-.5,1]),k=.55+.45*Math.max(0,dot(n,light));return[base[0]*k,base[1]*k,base[2]*k,a]}
function render(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing&&!drag){elapsed+=dt;if(elapsed>=+ui('speed').value)step(1)}const rect=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(rect.width*d)),h=Math.max(1,Math.round(rect.height*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const opacity=+ui('opacity').value/100,n=normals[direction%3],positive=direction<3,parts=[];if(ui('ghost').checked)for(const p of shell)parts.push({p,base:[.28,.46,.34],a:.1});for(const p of shell){const q=clip(p,n,positive);if(q.length>2)parts.push({p:q,base:[.24,.62,.36],a:opacity})}const cut=plane(n);parts.push({p:positive?cut:[...cut].reverse(),base:[.94,.57,.22],a:opacity});const aspect=rect.width/rect.height,tris=[],lines=[];for(const part of parts){for(let i=1;i<part.p.length-1;i++){const a=part.p[0],b=part.p[i],c=part.p[i+1],u=sub(b,a),v=sub(c,a),nn=norm([u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]);tris.push({p:[a,b,c],col:color(part.base,part.a,nn)})}if(ui('wire').checked)for(let i=0;i<part.p.length;i++)lines.push([part.p[i],part.p[(i+1)%part.p.length]])}tris.sort((a,b)=>a.p.reduce((s,q)=>s+project(q,aspect)[2],0)-b.p.reduce((s,q)=>s+project(q,aspect)[2],0));const pp=[],cc=[];for(const t of tris)for(const q of t.p){pp.push(...project(q,aspect));cc.push(...t.col)}draw(gl.TRIANGLES,pp,cc);if(ui('wire').checked){gl.disable(gl.DEPTH_TEST);const lp=[],lc=[];for(const e of lines)for(const q of e){lp.push(...project(q,aspect));lc.push(.86,.93,1,.5)}draw(gl.LINES,lp,lc);gl.enable(gl.DEPTH_TEST)}requestAnimationFrame(render)}
ui('previous').onclick=()=>step(-1);ui('next').onclick=()=>step(1);ui('play').onclick=()=>{playing=!playing;ui('play').textContent=playing?'Pause':'Play'};ui('speed').oninput=updateText;ui('opacity').oninput=updateText;ui('reset').onclick=()=>{yaw=-.58;pitch=.52;zoom=1};canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-lx)*.009;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-ly)*.009));lx=e.clientX;ly=e.clientY};canvas.onpointerup=()=>drag=false;canvas.onpointercancel=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.8,zoom-e.deltaY*.001))};updateText();requestAnimationFrame(render);
})();</script></body></html>
