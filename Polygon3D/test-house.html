<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhombic Dodecahedron Stacking Patterns</title>
<style>
:root{color-scheme:dark;--bg:#0e131a;--panel:#18212c;--line:#344354;--text:#eef5ff;--muted:#a8b5c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:16px}h1{margin:0;font-size:22px}.sub{color:var(--muted);margin:3px 0 12px}.stage{position:relative;height:min(75vh,720px);min-height:480px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#263b4d 0,#131c26 50%,#0d1219 100%)}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}.label{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-weight:700;font-size:24px;letter-spacing:.18em;text-shadow:0 2px 8px #000}.hud{position:absolute;left:14px;bottom:12px;color:var(--muted);pointer-events:none}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:11px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.controls label{display:flex;gap:6px;align-items:center}button{font:inherit;color:var(--text);background:#222e3b;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-top:9px}.swatch:before{content:"";display:inline-block;width:11px;height:11px;background:var(--c);margin-right:6px;border-radius:2px}@media(max-width:600px){.stage{height:560px}.label{font-size:18px}}
</style>
</head>
<body><main>
<h1>Rhombic Dodecahedron Stacking Study</h1><p class="sub">Exact FCC layers, half-block flattening, and center-to-edge radial walls.</p>
<section class="stage"><canvas id="gl" aria-label="Interactive WebGL rhombic dodecahedron stacking-pattern simulator"></canvas><div class="label" id="patternLabel">FULL FCC STACK</div><div class="hud" id="hud">Drag to orbit · wheel to zoom</div></section>
<div class="controls"><label>Pattern <select id="pattern"><option value="full">Full FCC stack</option><option value="flat">Actual horizontal center halves</option><option value="walls">Actual radial center halves</option><option value="combined">Actual horizontal + radial cuts</option></select></label><label>Radial orientation <select id="wallDirection"><option value="0">0°</option><option value="1">60°</option><option value="2">120°</option></select></label><label><input id="wire" type="checkbox" checked> Cell edges</label><label><input id="spin" type="checkbox"> Auto rotate</label><button id="front" type="button">Level view</button><button id="reset" type="button">Reset view</button></div>
<div class="legend"><span class="swatch" style="--c:#5d8f55">Full stacked cells</span><span class="swatch" style="--c:#d5b07a">Lower half shell</span><span class="swatch" style="--c:#e8a43b">Flat middle cap</span><span class="swatch" style="--c:#35cfa0">Radial wall faces</span></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('gl'),gl=canvas.getContext('webgl',{alpha:true,antialias:true});if(!gl){document.getElementById('hud').textContent='WebGL unavailable';return}
const V='attribute vec3 p;attribute vec4 c;varying vec4 v;void main(){gl_Position=vec4(p,1.);v=c;}',F='precision mediump float;varying vec4 v;void main(){gl_FragColor=v;}';function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,V));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(prog);gl.useProgram(prog);const bp=gl.createBuffer(),bc=gl.createBuffer(),ap=gl.getAttribLocation(prog,'p'),ac=gl.getAttribLocation(prog,'c');gl.enableVertexAttribArray(ap);gl.enableVertexAttribArray(ac);gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)},UP=norm([1,1,1]),RIGHT=norm([1,-1,0]),BACK=norm([1,1,-2]),tr=p=>[dot(p,RIGHT),dot(p,BACK),dot(p,UP)],S=[-1,1],C={},X={},Y={},Z={},key=(x,y,z)=>x+','+y+','+z;for(const x of S)for(const y of S)for(const z of S)C[key(x,y,z)]=[x,y,z];for(const s of S){X[s]=[2*s,0,0];Y[s]=[0,2*s,0];Z[s]=[0,0,2*s]}const src=[];for(const s of S)for(const t of S)src.push([X[s],C[key(s,t,1)],Y[t],C[key(s,t,-1)]]);for(const s of S)for(const u of S)src.push([X[s],C[key(s,1,u)],Z[u],C[key(s,-1,u)]]);for(const t of S)for(const u of S)src.push([Y[t],C[key(1,t,u)],Z[u],C[key(-1,t,u)]]);const mesh=src.map(f=>f.map(tr));
const EPS=1e-7;function clipAt(poly,axis,threshold,positive){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=dot(a,axis)-threshold,db=dot(b,axis)-threshold,ia=positive?da>=-EPS:da<=EPS,ib=positive?db>=-EPS:db<=EPS;if(ia)out.push(a);if(ia!==ib)out.push(add(a,mul(sub(b,a),da/(da-db))))}return out}function clip(poly,axis,positive){return clipAt(poly,axis,0,positive)}const allEdges=[];for(const f of mesh)for(let i=0;i<f.length;i++){const a=f[i],b=f[(i+1)%f.length],same=(p,q)=>Math.hypot(...sub(p,q))<1e-5;if(!allEdges.some(e=>(same(e[0],a)&&same(e[1],b))||(same(e[0],b)&&same(e[1],a))))allEdges.push([a,b])}function planePolyAt(n,threshold=0){const pts=[];for(const[a,b]of allEdges){const da=dot(a,n)-threshold,db=dot(b,n)-threshold;if(Math.abs(da)<EPS)pts.push(a);if(Math.abs(db)<EPS)pts.push(b);if(da*db<-EPS)pts.push(add(a,mul(sub(b,a),da/(da-db))))}const q=[];for(const p of pts)if(!q.some(v=>Math.hypot(...sub(p,v))<1e-5))q.push(p);const seed=Math.abs(n[2])<.9?[0,0,1]:[1,0,0],u=norm([seed[1]*n[2]-seed[2]*n[1],seed[2]*n[0]-seed[0]*n[2],seed[0]*n[1]-seed[1]*n[0]]),v=norm([n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]]);return q.sort((a,b)=>Math.atan2(dot(a,v),dot(a,u))-Math.atan2(dot(b,v),dot(b,u)))}function planePoly(n){return planePolyAt(n,0)}const facadeAxis=[0,1,0],facadeFace=planePoly(facadeAxis),slopeAxes=[[1,1,-1],[1,-1,1]].map(v=>norm(tr(v))),slopeFaces=slopeAxes.map(planePoly);
const colors={full:[.26,.48,.25,1],half:[.72,.52,.3,1],cap:[.94,.58,.12,1],radial:[.12,.78,.58,1]},zAxis=[0,0,1],middleFace=planePoly(zAxis),radialNormals=[[0,1,0],[-Math.sqrt(3)/2,.5,0],[Math.sqrt(3)/2,.5,0]],radialFaces=radialNormals.map(planePoly),cells=[],blockScale=.24,u=[2*Math.SQRT2*blockScale,0,0],v=[Math.SQRT2*blockScale,-Math.sqrt(6)*blockScale,0],offset=[(u[0]+v[0])/3,(u[1]+v[1])/3,0],layerH=4/Math.sqrt(3)*blockScale;for(let layer=0;layer<3;layer++)for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){if(Math.max(Math.abs(i),Math.abs(j),Math.abs(i-j))>2)continue;cells.push({x:i*u[0]+j*v[0]+layer*offset[0],y:i*u[1]+j*v[1]+layer*offset[1],z:-.55+layer*layerH,layer,i,j,scale:blockScale})}
const ui=id=>document.getElementById(id);let yaw=-.55,pitch=.48,zoom=.86,drag=false,lx=0,ly=0,last=performance.now();function project(v,aspect){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),rx=v[0]*cy-v[1]*sy,depth0=v[0]*sy+v[1]*cy,screenY=v[2]*cp-depth0*sp,depth=depth0*cp+v[2]*sp,s=.31*zoom;return[rx*s/aspect,(screenY+.05)*s,depth*.035]}
function shade(base,n){const light=norm([-.4,-.5,1]),k=.5+.5*Math.max(0,dot(n,light));return[base[0]*k,base[1]*k,base[2]*k,base[3]]}function draw(mode,p,c){if(!p.length)return;gl.bindBuffer(gl.ARRAY_BUFFER,bp);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(p),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,bc);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(c),gl.DYNAMIC_DRAW);gl.vertexAttribPointer(ac,4,gl.FLOAT,false,0,0);gl.drawArrays(mode,0,p.length/3)}
function partsFor(c,mode,wallPair){if(mode==='full')return mesh.map(p=>({p,type:'full'}));if(mode==='flat'){if(c.layer<2)return mesh.map(p=>({p,type:'full'}));const parts=mesh.map(p=>clip(p,zAxis,false)).filter(p=>p.length>2).map(p=>({p,type:'half'}));parts.push({p:middleFace,type:'cap'});return parts}const parts=[],n=radialNormals[wallPair],center=[c.x,c.y,c.z],centerDistance=dot(center,n),sameLayer=cells.filter(q=>q.layer===c.layer),boundaryDistance=Math.min(...sameLayer.map(q=>dot([q.x,q.y,q.z],n)).filter(value=>value>=-EPS));if(centerDistance<boundaryDistance-EPS)return parts;const boundary=Math.abs(centerDistance-boundaryDistance)<1e-5,cutTop=mode==='combined'&&c.layer===2;for(const face of mesh){let p=boundary?clip(face,n,true):face;if(cutTop)p=clip(p,zAxis,false);if(p.length>2)parts.push({p,type:boundary||cutTop?'half':'full'})}if(boundary){let wallCap=planePoly(n);if(cutTop)wallCap=clip(wallCap,zAxis,false);if(wallCap.length>2)parts.push({p:wallCap,type:'radial'})}if(cutTop){let topCap=middleFace;if(boundary)topCap=clip(topCap,n,true);if(topCap.length>2)parts.push({p:topCap,type:'cap'})}return parts}
function render(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ui('spin').checked&&!drag)yaw+=dt*.2;const mode=ui('pattern').value,wallPair=+ui('wallDirection').value,labels={full:'FULL FCC STACK',flat:'SYMMETRIC HORIZONTAL CENTER CUTS',walls:'ACTUAL SYMMETRIC RADIAL CENTER CUTS',combined:'ACTUAL HORIZONTAL + RADIAL CUTS'},r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));ui('patternLabel').textContent=labels[mode];if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const aspect=r.width/r.height,tris=[],edgeLines=[];for(const c of cells){for(const part of partsFor(c,mode,wallPair)){const p=part.p.map(q=>[q[0]*c.scale+c.x,q[1]*c.scale+c.y,q[2]*c.scale+c.z]),a=p[0],b=p[1],cc=p[2],aa=sub(b,a),bb=sub(cc,a),n=norm([aa[1]*bb[2]-aa[2]*bb[1],aa[2]*bb[0]-aa[0]*bb[2],aa[0]*bb[1]-aa[1]*bb[0]]),col=shade(colors[part.type],n);for(let i=1;i<p.length-1;i++)tris.push({p:[p[0],p[i],p[i+1]],col});if(ui('wire').checked)for(let i=0;i<p.length;i++)edgeLines.push([p[i],p[(i+1)%p.length]])}}tris.sort((a,b)=>a.p.reduce((s,q)=>s+project(q,aspect)[2],0)-b.p.reduce((s,q)=>s+project(q,aspect)[2],0));const pp=[],pc=[];for(const t of tris)for(const q of t.p){pp.push(...project(q,aspect));pc.push(...t.col)}draw(gl.TRIANGLES,pp,pc);if(ui('wire').checked){gl.disable(gl.DEPTH_TEST);const ep=[],ec=[];for(const e of edgeLines)for(const q of e){ep.push(...project(q,aspect));ec.push(.83,.9,.96,.3)}draw(gl.LINES,ep,ec);gl.enable(gl.DEPTH_TEST)}requestAnimationFrame(render)}
canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-lx)*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY};canvas.onpointerup=()=>drag=false;canvas.onpointercancel=()=>drag=false;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.45,Math.min(1.35,zoom-e.deltaY*.001))};ui('front').onclick=()=>{yaw=0;pitch=.12;zoom=.9};ui('reset').onclick=()=>{yaw=-.55;pitch=.48;zoom=.86};requestAnimationFrame(render);
})();
</script></body></html>
