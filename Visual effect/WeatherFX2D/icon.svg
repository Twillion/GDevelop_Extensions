<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2b4d" />
      <stop offset="55%" stop-color="#2f4f7a" />
      <stop offset="100%" stop-color="#12324a" />
    </linearGradient>
    <linearGradient id="heat" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfd8ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#dceaff" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sky)" stroke="#0d1a2e" stroke-width="3" />

  <!-- Heat shimmer rising from the ground line -->
  <rect x="8" y="74" width="112" height="46" fill="url(#heat)" opacity="0.5" />
  <g fill="none" stroke="#ffce7a" stroke-width="2.6" stroke-linecap="round" opacity="0.75">
    <path d="M22 108 q7 -8 0 -16 q-7 -8 0 -16" />
    <path d="M46 110 q7 -8 0 -16 q-7 -8 0 -16" />
    <path d="M70 108 q7 -8 0 -16 q-7 -8 0 -16" />
    <path d="M94 110 q7 -8 0 -16 q-7 -8 0 -16" />
  </g>

  <!-- Rain streaks, angled with the wind -->
  <g stroke="url(#drop)" stroke-width="3.4" stroke-linecap="round">
    <line x1="26" y1="16" x2="20" y2="38" />
    <line x1="52" y1="10" x2="46" y2="32" />
    <line x1="78" y1="18" x2="72" y2="40" />
    <line x1="102" y1="12" x2="96" y2="34" />
    <line x1="40" y1="40" x2="34" y2="58" />
    <line x1="90" y1="44" x2="84" y2="62" />
  </g>

  <!-- Snow, sizes varying with depth -->
  <g fill="#ffffff">
    <circle cx="34" cy="26" r="4.2" />
    <circle cx="66" cy="44" r="3.2" opacity="0.85" />
    <circle cx="98" cy="30" r="2.4" opacity="0.7" />
    <circle cx="20" cy="58" r="2.8" opacity="0.8" />
    <circle cx="112" cy="56" r="3.6" opacity="0.9" />
    <circle cx="58" cy="66" r="2.2" opacity="0.6" />
  </g>

  <!-- Water ripple -->
  <g fill="none" stroke="#7fe3ff" stroke-linecap="round">
    <ellipse cx="64" cy="100" rx="30" ry="10" stroke-width="3" opacity="0.9" />
    <ellipse cx="64" cy="100" rx="17" ry="5.5" stroke-width="2.4" opacity="0.6" />
  </g>
</svg>
